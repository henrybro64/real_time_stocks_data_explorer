bind 0.0.0.0
port 6379

# Persist cache snapshots for safer local restarts.
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"

# Same memory behaviour as k8s/redis.yaml: a cap, no eviction of live keys, and
# no write stop when a snapshot fails (#293). Local keeps AOF as well as RDB.
maxmemory 128mb
maxmemory-policy noeviction
stop-writes-on-bgsave-error no
