[project]
name = "stock-ticker-api"
version = "0.0.1"
description = "FastAPI backend for a stock ticker MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "numpy",
  "pandas",
  "yfinance",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
