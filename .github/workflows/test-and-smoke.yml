name: Test And Smoke

on:
  push:
    branches:
      - main
      - master
    tags:
      # Same required jobs as main so GHCR publish can wait on them (#214).
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
  # No schedule: routine CI must not wake Azure SQL Free Offer (#186 / #187).

permissions:
  contents: read

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocks_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/stocks_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Prepare Allure results directory
        run: |
          mkdir -p allure-results/backend
          touch allure-results/backend/.keep
      - name: Install backend dependencies
        run: |
          python -m pip install "pip==25.2"
          python -m pip install --only-binary=:all: \
            "fastapi==0.116.1" \
            "uvicorn[standard]==0.35.0" \
            "pydantic==2.11.7" \
            "pydantic-settings==2.10.1" \
            "sqlalchemy==2.0.52" \
            "alembic==1.19.1" \
            "psycopg[binary]==3.3.4" \
            "httpx==0.28.1" \
            "itsdangerous==2.2.0" \
            "redis==8.1.0" \
            "PyJWT[crypto]==2.13.0" \
            "cryptography==50.0.1" \
            "numpy==2.4.6" \
            "pandas==3.0.5" \
            "yfinance==1.6.0" \
            "pytest==9.0.3" \
            "pytest-cov==6.1.1" \
            "allure-pytest==2.15.3" \
            "PyYAML==6.0.3"
      - name: Run backend tests
        run: pytest backend/tests/unit backend/tests/integration --alluredir allure-results/backend
      - name: Upload backend Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-allure-results
          retention-days: 1
          path: allure-results/backend
          if-no-files-found: warn

  frontend-playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocks_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/stocks_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Prepare Allure results directories
        run: |
          mkdir -p allure-results/frontend-unit allure-results/frontend-e2e
          touch allure-results/frontend-unit/.keep allure-results/frontend-e2e/.keep
      - name: Install backend dependencies
        run: |
          python -m pip install "pip==25.2"
          python -m pip install --only-binary=:all: \
            "fastapi==0.116.1" \
            "uvicorn[standard]==0.35.0" \
            "pydantic==2.11.7" \
            "pydantic-settings==2.10.1" \
            "sqlalchemy==2.0.52" \
            "alembic==1.19.1" \
            "psycopg[binary]==3.3.4" \
            "httpx==0.28.1" \
            "itsdangerous==2.2.0" \
            "redis==8.1.0" \
            "PyJWT[crypto]==2.13.0" \
            "cryptography==50.0.1" \
            "numpy==2.4.6" \
            "pandas==3.0.5" \
            "yfinance==1.6.0" \
            "pytest==9.0.3" \
            "pytest-cov==6.1.1" \
            "allure-pytest==2.15.3" \
            "PyYAML==6.0.3"
      - name: Install frontend dependencies
        # --ignore-scripts: avoid arbitrary package lifecycle scripts; browsers installed next.
        run: npm ci --prefix frontend --ignore-scripts
      - name: Install Playwright browser
        # GitHub-hosted Ubuntu runners already provide the system libraries
        # Chromium needs for this project. Skipping `--with-deps` avoids
        # lengthy apt mirror stalls during CI setup.
        run: ./frontend/node_modules/.bin/playwright install chromium
      - name: Run frontend unit tests
        id: frontend_unit_tests
        continue-on-error: true
        env:
          ALLURE_RESULTS_DIR: ../allure-results/frontend-unit
        run: npm test --prefix frontend
      - name: Run Playwright E2E
        id: frontend_e2e_tests
        continue-on-error: true
        env:
          ALLURE_RESULTS_DIR: ../allure-results/frontend-e2e
        run: npm run test:e2e --prefix frontend
      - name: Upload frontend unit Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-allure-results
          retention-days: 1
          path: allure-results/frontend-unit
          if-no-files-found: warn
      - name: Upload frontend e2e Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-allure-results
          retention-days: 1
          path: allure-results/frontend-e2e
          if-no-files-found: warn
      - name: Upload Playwright HTML report
        if: always() && steps.frontend_e2e_tests.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          retention-days: 14
          path: frontend/playwright-report
          if-no-files-found: warn
      - name: Fail job when any frontend suite fails
        if: always()
        run: |
          status=0
          if [ "${{ steps.frontend_unit_tests.outcome }}" != "success" ]; then
            echo "Frontend unit tests failed"
            status=1
          fi
          if [ "${{ steps.frontend_e2e_tests.outcome }}" != "success" ]; then
            echo "Frontend Playwright E2E failed"
            status=1
          fi
          exit "${status}"

  k3s-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-pytest
      - frontend-playwright
    env:
      NAMESPACE: stock-ticker
      BACKEND_IMAGE: stock-ticker-backend:local
      FRONTEND_IMAGE: stock-ticker-frontend:local
      KUBECTL_CMD: sudo k3s kubectl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Prepare Allure results directory
        run: |
          mkdir -p allure-results/k3s-smoke
          touch allure-results/k3s-smoke/.keep
          mkdir -p artifacts/k3s-smoke
      - name: Install smoke test dependencies
        run: |
          python -m pip install "pip==25.2"
          python -m pip install --only-binary=:all: "pytest==9.0.3" "allure-pytest==2.15.3"
      - name: Install k3s
        env:
          # Pin release so installer and checksums are immutable for this workflow revision.
          INSTALL_K3S_VERSION: v1.31.5+k3s1
        run: |
          # Official install script + matching sha256 from the same pinned tag (no curl|sh).
          tag="${INSTALL_K3S_VERSION}"
          install_script="${RUNNER_TEMP}/k3s-install.sh"
          # Prefer the install script from the pinned tag in the k3s repo (immutable raw content).
          curl -fsSL --proto '=https' --tlsv1.2 -o "${install_script}"             "https://raw.githubusercontent.com/k3s-io/k3s/${tag}/install.sh"
          test -s "${install_script}"
          grep -q 'INSTALL_K3S' "${install_script}"
          chmod 0700 "${install_script}"
          INSTALL_K3S_VERSION="${tag}" INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable traefik" sh "${install_script}"
          sudo k3s kubectl get nodes
      - name: Run k3s deployment smoke
        run: |
          ARTIFACT_DIR=artifacts/k3s-smoke \
          pytest backend/tests/smoke/test_k3s_smoke.py --alluredir allure-results/k3s-smoke
      - name: Publish k3s smoke summary
        if: always()
        run: |
          if [ ! -f artifacts/k3s-smoke/summary.txt ]; then
            echo "Missing required smoke evidence: artifacts/k3s-smoke/summary.txt" >&2
            exit 1
          fi
          {
            echo "## K3s smoke evidence"
            echo
            cat artifacts/k3s-smoke/summary.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload k3s smoke Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: k3s-smoke-allure-results
          retention-days: 1
          path: allure-results/k3s-smoke
          if-no-files-found: warn
      - name: Upload k3s smoke evidence artifacts
        if: always()
        # Best-effort: free-tier Actions storage quota must not fail a green smoke
        # after summary.txt is already published to the job summary.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: k3s-smoke-artifacts
          retention-days: 7
          path: artifacts/k3s-smoke
          if-no-files-found: error

  # MANUAL-ONLY live Azure SQL smoke (#186 / #187).
  # Cost warning: this job logs into Azure, may open a temporary firewall rule,
  # connects over ODBC/SQLAlchemy, and can WAKE a paused serverless Free Offer
  # database (consumes vCore quota). Do not run unless you intentionally need
  # live connectivity verification.
  # Never runs on push, pull_request, or schedule — only workflow_dispatch on
  # main/master so branch-modified scripts cannot consume repository secrets.
  azure-rankings-archive-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_SQL_SERVER_NAME: ${{ secrets.AZURE_SQL_SERVER_NAME }}
      RANKINGS_ARCHIVE_DATABASE_URL: ${{ secrets.RANKINGS_ARCHIVE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cost warning (manual live Azure SQL)
        run: |
          {
            echo "## Manual live Azure SQL smoke — cost warning"
            echo ""
            echo "This job **wakes** the live archive database if it is AutoPaused."
            echo "It consumes Azure SQL Free Offer compute quota and is **not** part of routine CI."
            echo "Use only for deliberate connectivity / integration verification (#186 / #187)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required secrets are present
        id: secrets_check
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP AZURE_SQL_SERVER_NAME RANKINGS_ARCHIVE_DATABASE_URL; do
            eval "value=\${$name}"
            if [ -z "${value}" ]; then
              echo "Missing required secret/env: $name" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Azure login: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Azure login (service principal)
        id: azure_login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          # Secret-based SP auth uses `creds` (client-secret is not a valid input).
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Note Azure login success
        run: |
          echo "Azure login: PASS" >> "$GITHUB_STEP_SUMMARY"

      # Read-only Free Offer check (#186). Does not open SQL / does not need firewall.
      # Fails the job loudly when live useFreeLimit is not true (paid risk).
      # Always verify the database named in RANKINGS_ARCHIVE_DATABASE_URL so the
      # Free Offer check and SQL smoke cannot target different databases.
      - name: Verify Azure SQL Free Offer enrollment
        id: free_offer
        env:
          AZURE_SQL_DATABASE_NAME: ${{ secrets.AZURE_SQL_DATABASE_NAME }}
        run: |
          set -euo pipefail
          DB_FROM_URL="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ["RANKINGS_ARCHIVE_DATABASE_URL"]
          for prefix in ("mssql+pyodbc://", "mssql+pymssql://"):
              if raw.startswith(prefix):
                  raw = "mssql://" + raw[len(prefix):]
                  break
          path = urlparse(raw).path.lstrip("/")
          name = path.split("?", 1)[0].strip()
          if not name:
              raise SystemExit("RANKINGS_ARCHIVE_DATABASE_URL has no database name")
          print(name)
          PY
          )"
          CONFIGURED_NAME="${AZURE_SQL_DATABASE_NAME:-}"
          if [ -n "$CONFIGURED_NAME" ] && [ "$CONFIGURED_NAME" != "$DB_FROM_URL" ]; then
            echo "Free Offer verification: FAIL (AZURE_SQL_DATABASE_NAME=$CONFIGURED_NAME != URL database=$DB_FROM_URL)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 scripts/verify_azure_rankings_archive_free_offer.py \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER_NAME" \
            --database "$DB_FROM_URL" \
            --ci-summary

      - name: Create temporary SQL firewall rule for runner IP
        id: firewall
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          if ! [[ "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Temporary firewall: FAIL (could not determine runner IPv4)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          RULE_NAME="gha-archive-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RULE_NAME=$RULE_NAME" >> "$GITHUB_ENV"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

          PUBLIC_ACCESS="$(az sql server show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_SQL_SERVER_NAME" \
            --query publicNetworkAccess -o tsv)"
          if [ "$PUBLIC_ACCESS" != "Enabled" ]; then
            echo "Temporary firewall: FAIL (publicNetworkAccess=$PUBLIC_ACCESS; enable public access or use private connectivity — workflow will not widen server security)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER_NAME" \
            --name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" >/dev/null
          echo "Temporary firewall: PASS (single-IP rule)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build backend image (ODBC Driver 18 + pyodbc parity)
        run: docker build -t stock-ticker-backend:azure-smoke -f backend/Dockerfile .

      - name: Run live Azure SQL archive smoke in backend image
        id: smoke
        run: |
          set -euo pipefail
          SUMMARY_FILE="$RUNNER_TEMP/azure-smoke-summary.md"
          : > "$SUMMARY_FILE"
          docker run --rm \
            -e RANKINGS_ARCHIVE_DATABASE_URL \
            -e PYTHONPATH=/app/backend \
            -e GITHUB_STEP_SUMMARY=/tmp/smoke-summary.md \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$SUMMARY_FILE:/tmp/smoke-summary.md" \
            -w /app/backend \
            stock-ticker-backend:azure-smoke \
            python /scripts/azure_rankings_archive_smoke.py --ci-summary
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary SQL firewall rule
        if: always() && env.RULE_NAME != ''
        run: |
          set -euo pipefail
          if az sql server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER_NAME" \
            --name "$RULE_NAME" \
            --yes >/dev/null; then
            echo "Firewall cleanup: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Firewall cleanup: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  allure-report:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-pytest
      - frontend-playwright
      - k3s-smoke
    outputs:
      # Only deploy Pages when the pages artifact upload actually succeeded.
      pages_artifact_ready: ${{ steps.upload_pages_artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts
      - name: Download backend Allure results
        id: download_backend_allure
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: backend-allure-results
          path: allure-results/backend
      - name: Download frontend unit Allure results
        id: download_frontend_unit_allure
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-unit-allure-results
          path: allure-results/frontend-unit
      - name: Download frontend e2e Allure results
        id: download_frontend_e2e_allure
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-e2e-allure-results
          path: allure-results/frontend-e2e
      - name: Download k3s smoke Allure results
        id: download_k3s_smoke_allure
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: k3s-smoke-allure-results
          path: allure-results/k3s-smoke
      # Require the three core suite artifacts before publishing a report so a
      # missing download cannot replace the last complete Allure/Pages report.
      - name: Merge Allure results
        id: merge_allure
        continue-on-error: true
        if: >-
          steps.download_backend_allure.outcome == 'success' &&
          steps.download_frontend_unit_allure.outcome == 'success' &&
          steps.download_frontend_e2e_allure.outcome == 'success'
        run: python3 scripts/merge_allure_results.py allure-results/merged allure-results/backend allure-results/frontend-unit allure-results/frontend-e2e allure-results/k3s-smoke
      - name: Generate Allure report
        id: generate_allure
        continue-on-error: true
        if: steps.merge_allure.outcome == 'success'
        run: |
          rm -rf allure-report
          ./frontend/node_modules/.bin/allure generate allure-results/merged -o allure-report
      - name: Upload merged Allure results
        if: steps.merge_allure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: merged-allure-results
          retention-days: 1
          path: allure-results/merged
          if-no-files-found: warn
      - name: Upload Allure HTML report
        if: steps.generate_allure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          retention-days: 7
          path: allure-report
          if-no-files-found: warn
      - name: Upload GitHub Pages artifact
        id: upload_pages_artifact
        if: ${{ vars.ENABLE_ALLURE_PAGES == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && steps.generate_allure.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report
          retention-days: 1
      - name: Note when Allure packaging was skipped
        if: always() && (steps.merge_allure.outcome != 'success' || steps.generate_allure.outcome != 'success')
        run: |
          echo "Allure report packaging skipped or incomplete (often artifact storage quota)." >> "$GITHUB_STEP_SUMMARY"
          echo "Test job results are authoritative; this job is best-effort reporting." >> "$GITHUB_STEP_SUMMARY"

  deploy-allure-pages:
    runs-on: ubuntu-latest
    if: ${{ always() && vars.ENABLE_ALLURE_PAGES == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && needs.allure-report.outputs.pages_artifact_ready == 'true' }}
    needs:
      - allure-report
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish Pages URL in workflow summary
        run: |
          echo "Allure report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
