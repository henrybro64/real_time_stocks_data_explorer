name: Test And Smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocks_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/stocks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: pytest backend/tests/unit backend/tests/integration

  frontend-playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocks_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/stocks_test
      TW_USE_MOCK_QUOTES: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run frontend unit tests
        run: npm test --prefix frontend
      - name: Run Playwright E2E
        run: npm run test:e2e --prefix frontend

  k3s-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-pytest
      - frontend-playwright
    env:
      NAMESPACE: stock-ticker
      BACKEND_IMAGE: stock-ticker-backend:local
      FRONTEND_IMAGE: stock-ticker-frontend:local
      KUBECTL_CMD: sudo k3s kubectl
    steps:
      - uses: actions/checkout@v4
      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable traefik" sh -
          sudo k3s kubectl get nodes
      - name: Run k3s deployment smoke
        run: ./scripts/ci-k3s-smoke.sh
