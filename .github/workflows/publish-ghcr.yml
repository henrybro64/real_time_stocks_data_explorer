# Publish backend and frontend images to GitHub Container Registry (#214).
# Runs after Test And Smoke on main/master/v*.*.* (not PRs). latest is default-branch only.
# Required test jobs (not Allure) must be green. workflow_dispatch is default-branch only.
name: Publish GHCR Images

on:
  workflow_run:
    workflows:
      - Test And Smoke
    types:
      - completed
    branches:
      - main
      - master
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: publish-ghcr-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  decide:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master' || startsWith(github.event.workflow_run.head_branch, 'v'))) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.ctx.outputs.publish }}
      sha: ${{ steps.ctx.outputs.sha }}
      latest: ${{ steps.ctx.outputs.latest }}
      version: ${{ steps.ctx.outputs.version }}
      major_minor: ${{ steps.ctx.outputs.major_minor }}
    steps:
      - name: Resolve publish context and require green test jobs
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA_VALUE}"
          latest="false"
          version=""
          major_minor=""
          publish="true"

          case "${EVENT_NAME}" in
            workflow_run)
              sha="${RUN_SHA}"
              if [[ "${RUN_BRANCH}" == "${DEFAULT_BRANCH}" ]]; then
                latest="true"
              fi
              if [[ "${RUN_BRANCH}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                version="${RUN_BRANCH#v}"
                major_minor="${version%.*}"
              fi
              jobs_json="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs")"
              for job_name in backend-pytest frontend-playwright k3s-smoke; do
                conclusion="$(
                  printf '%s' "${jobs_json}" | jq -r --arg name "${job_name}" \
                    '[.jobs[] | select(.name == $name) | .conclusion] | first // "missing"'
                )"
                echo "CI job ${job_name}=${conclusion}"
                if [[ "${conclusion}" != "success" ]]; then
                  echo "Required CI job ${job_name} is not green; skipping publish."
                  publish="false"
                fi
              done
              ;;
            workflow_dispatch)
              latest="true"
              ;;
          esac

          if [[ "${latest}" == "true" && "${publish}" == "true" ]]; then
            tip="$(gh api "repos/${GH_REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)"
            if [[ "${sha}" != "${tip}" ]]; then
              echo "SHA ${sha} is not ${DEFAULT_BRANCH} tip ${tip}; will not retag latest"
              latest="false"
            fi
          fi

          printf 'publish=%s\n' "${publish}" >> "${GITHUB_OUTPUT}"
          printf 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"
          printf 'latest=%s\n' "${latest}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'major_minor=%s\n' "${major_minor}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: backend/Dockerfile
          - name: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Resolve lowercase GHCR image name
        id: image
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${repo}-${{ matrix.name }}" >> "${GITHUB_OUTPUT}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.decide.outputs.sha }}
            org.opencontainers.image.title=real_time_stocks_data_explorer-${{ matrix.name }}
          tags: |
            type=raw,value=build-${{ github.run_id }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache stays within packages:write (GHA cache needs actions:write).
          # :buildcache is a Buildx layer cache on the same package, not a runnable app tag.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  # Release tags are applied only after both matrix builds succeed so SHA/latest/semver stay paired.
  promote:
    needs:
      - decide
      - publish
    if: success() && needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote SHA and mutable tags from staging builds
        env:
          SHA: ${{ needs.decide.outputs.sha }}
          LATEST: ${{ needs.decide.outputs.latest }}
          VERSION: ${{ needs.decide.outputs.version }}
          MAJOR_MINOR: ${{ needs.decide.outputs.major_minor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STAGING_TAG: build-${{ github.run_id }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          latest="${LATEST}"
          if [[ "${latest}" == "true" ]]; then
            tip="$(gh api "repos/${GH_REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)"
            if [[ "${SHA}" != "${tip}" ]]; then
              echo "SHA ${SHA} is not ${DEFAULT_BRANCH} tip ${tip}; will not retag latest"
              latest="false"
            fi
          fi
          for name in backend frontend; do
            image="ghcr.io/${owner}/${repo}-${name}"
            src="${image}:${STAGING_TAG}"
            create_args=(-t "${image}:${SHA}")
            if [[ "${latest}" == "true" ]]; then
              create_args+=(-t "${image}:latest")
            fi
            if [[ -n "${VERSION}" ]]; then
              create_args+=(-t "${image}:${VERSION}")
            fi
            if [[ -n "${MAJOR_MINOR}" ]]; then
              create_args+=(-t "${image}:${MAJOR_MINOR}")
            fi
            echo "Promoting ${src} -> ${create_args[*]}"
            docker buildx imagetools create "${create_args[@]}" "${src}"
          done
