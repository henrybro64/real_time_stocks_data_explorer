sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# CI workflow install patterns are noisy when the workflow file is "new code".
# Product Docker/Python/Terraform remain in analysis scope.
sonar.exclusions=.github/workflows/**

# Ops smoke scripts, unit-test fixtures, and bilingual UI copy tables create CPD noise without product signal.
sonar.cpd.exclusions=scripts/**,**/tests/**,frontend/src/views/realized-gains/realizedGainsI18n.ts
