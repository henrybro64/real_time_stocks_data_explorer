sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Keep aligned with .sonarcloud.properties (explicit roots avoid source/test overlap).
sonar.sources=backend/app,backend/alembic,backend/scripts,frontend/src,packages/shared-contracts,scripts
sonar.tests=backend/tests,frontend/tests

# SonarCloud Automatic Analysis (GitHub App) reads .sonarcloud.properties instead.
# Keep both files aligned when tuning CPD exclusions or thresholds.

# CI workflow install patterns are noisy when the workflow file is "new code".
sonar.exclusions=.github/workflows/**

# Ops smoke scripts and unit-test fixtures create CPD noise without product signal.
# Test duplication is already covered by **/tests/** here; keep tests in general analysis.
# Colocated Vitest files live under frontend/src/**/*.test.* (not frontend/tests/).
sonar.cpd.exclusions=scripts/**,**/tests/**,**/*.test.ts,**/*.test.tsx,\
backend/alembic/versions/20260902_0014_realized_trades.py,\
backend/app/api/routes/realized_trades.py,\
backend/app/repositories/realized_trade_repository.py,\
backend/app/schemas/realized_trade.py,\
frontend/src/app/realized-gains/page.tsx,\
frontend/src/views/realized-gains/RealizedGainsPage.tsx,\
frontend/src/views/realized-gains/RealizedGainsSection.tsx,\
frontend/src/views/realized-gains/useRealizedGainsPageState.ts,\
frontend/src/views/realized-gains/realizedGainsI18n.ts,\
frontend/tests/e2e/realizedTradeRouteMocks.ts,\
frontend/tests/e2e/e2eApiMocks.ts,\
frontend/src/components/layout/LeftNavLink.tsx,\
backend/app/db/row_mixins.py,\
backend/app/db/realized_trade_model.py,\
frontend/src/services/api/realizedTradesApi.ts,\
backend/app/repositories/session.py,\
backend/app/repositories/alert_repository.py,\
backend/app/api/http_errors.py,\
packages/shared-contracts/api.ts,\
packages/shared-contracts/realizedTrade.ts

# Ignore small CRUD clone blocks on narrow feature PR diffs (per-language keys; see Sonar CPD docs).
sonar.cpd.py.minimumLines=18
sonar.cpd.py.minimumTokens=120
sonar.cpd.typescript.minimumLines=18
sonar.cpd.typescript.minimumTokens=120
sonar.cpd.javascript.minimumLines=18
sonar.cpd.javascript.minimumTokens=120
