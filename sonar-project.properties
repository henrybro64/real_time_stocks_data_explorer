sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# CI workflow install patterns are noisy when the workflow file is "new code".
sonar.exclusions=.github/workflows/**,**/tests/**

# Ops smoke scripts, unit tests, and alembic migration boilerplate create CPD noise.
sonar.cpd.exclusions=scripts/**,**/tests/**,**/alembic/versions/*realized_trades*.py
