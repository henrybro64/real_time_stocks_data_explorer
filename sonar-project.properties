sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# CI workflow install patterns are noisy when the workflow file is "new code".
sonar.exclusions=.github/workflows/**,**/tests/**

# Ops smoke scripts, unit tests, and feature boilerplate that mirrors existing CRUD patterns.
sonar.cpd.exclusions=scripts/**,**/tests/**,**/alembic/versions/*realized_trades*.py,**/realized-gains/**,**/realized_trade*.py,**/realized_trades*.py,**/realizedTrade*.ts,packages/shared-contracts/realizedTrade.ts,frontend/src/hooks/useCrudResource.ts,frontend/src/services/api/client.ts,frontend/src/app/i18n.tsx,frontend/src/components/layout/Shell.tsx,frontend/tests/e2e/realizedTradeRouteMocks.ts,frontend/tests/e2e/e2eApiMocks.ts

# Ignore small CRUD clones on narrow new-code diffs.
sonar.cpd.minimumLines=20
