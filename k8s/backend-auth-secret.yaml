# Local auth + session signing.
apiVersion: v1
kind: Secret
metadata:
  name: stock-ticker-backend-auth
type: Opaque
stringData:
  # Min 16 chars when AUTH_ENABLED=true; replace in production.
  SESSION_SECRET: "k8s-dev-replace-with-openssl-rand-hex-32-chars-minimum-16"
  # Optional bootstrap local auth credentials (if set, account is created/updated on startup)
  LOCAL_AUTH_USERNAME: "admin"
  LOCAL_AUTH_PASSWORD: "change-me-local-password"
  # Header token for POST /api/portfolio/history/capture (used by CronJob).
  PORTFOLIO_HISTORY_CAPTURE_TOKEN: "k8s-dev-replace-with-random-capture-token"
  # Header token for POST /api/rankings/snapshot/refresh (used by CronJob).
  RANKINGS_SNAPSHOT_REFRESH_TOKEN: "k8s-dev-replace-with-random-rankings-token"
