# OAuth + session signing. Override values before enabling AUTH_ENABLED in backend ConfigMap.
# For Microsoft redirect URIs, PUBLIC_BASE_URL in stock-ticker-backend-env must match the browser origin
# (e.g. http://192.168.120.102:30080 for LAN NodePort).
apiVersion: v1
kind: Secret
metadata:
  name: stock-ticker-backend-auth
type: Opaque
stringData:
  # Min 16 chars when AUTH_ENABLED=true; replace in production.
  SESSION_SECRET: "k8s-dev-replace-with-openssl-rand-hex-32-chars-minimum-16"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  MICROSOFT_CLIENT_ID: ""
  MICROSOFT_CLIENT_SECRET: ""
  MICROSOFT_TENANT: "consumers"
