# Redis holds caches, rate-limit counters and leader locks. It persists RDB
# snapshots to a small volume so quotes and stock-AI narratives survive a pod
# restart, and has an explicit memory cap so it evicts instead of being OOM-killed (#293).
apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-ticker-redis-config
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    dir /data
    # RDB snapshots only: losing the last minute of a cache on a crash is fine.
    save 300 10
    save 60 1000
    appendonly no
    # A failed snapshot (disk full) must not stop the cache accepting writes.
    stop-writes-on-bgsave-error no
    # Well under the 256Mi container limit: a snapshot forks, and copy-on-write needs headroom.
    maxmemory 128mb
    maxmemory-policy allkeys-lru
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stock-ticker-redis-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-redis
spec:
  replicas: 1
  # RWO volume: tear the old pod down before starting the new one, like Postgres.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stock-ticker-redis
  template:
    metadata:
      labels:
        app: stock-ticker-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # args, not command: the image entrypoint chowns /data and drops to the redis user.
          args: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: stock-ticker-redis-config
        - name: data
          persistentVolumeClaim:
            claimName: stock-ticker-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-redis
spec:
  selector:
    app: stock-ticker-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
