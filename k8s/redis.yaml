apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ticker-redis
  template:
    metadata:
      labels:
        app: stock-ticker-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-redis
spec:
  selector:
    app: stock-ticker-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
