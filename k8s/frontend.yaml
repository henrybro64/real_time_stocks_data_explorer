apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-ticker-frontend-env
data:
  BACKEND_PROXY_URL: http://stock-ticker-backend:8000
  NEXT_PUBLIC_API_PREFIX: /api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ticker-frontend
  template:
    metadata:
      labels:
        app: stock-ticker-frontend
    spec:
      containers:
        - name: frontend
          image: stock-ticker-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: stock-ticker-frontend-env
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-frontend
spec:
  selector:
    app: stock-ticker-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
