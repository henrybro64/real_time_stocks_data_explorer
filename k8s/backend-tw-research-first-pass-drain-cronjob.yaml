apiVersion: batch/v1
kind: CronJob
metadata:
  name: stock-ticker-tw-research-first-pass-drain
spec:
  # Suspended until Henry explicitly enables durable first-pass drain (#349/#362).
  # Prerequisites (all required for honest "executor available"):
  #   1) Secret stock-ticker-backend-auth key TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN
  #   2) Backend env TW_RESEARCH_FIRST_PASS_DRAIN_ENABLED=true
  #   3) Backend env TW_RESEARCH_FIRST_PASS_DRAIN_USER_ID=<owner user id>
  #   4) This CronJob suspend=false (operator-approved only)
  #   5) Managed Start/Resume sets research_run.schedule_enabled=true for the
  #      owned job (#366 re-arms the same run after executor becomes available)
  # Does NOT unsuspend the technical-scan schedule CronJob (#330).
  # concurrencyPolicy: Forbid — at most one drain Job at a time.
  suspend: true
  # Every 5 minutes every day (Asia/Taipei). Still suspend:true until enabled.
  # Timing hierarchy (#360): symbol soft deadline 45s < budget 60s
  # < curl --max-time 150s < activeDeadlineSeconds 180s < lease 300s.
  # Lease renews after each finished symbol so a slow symbol cannot starve reclaim.
  # Symbols persist incrementally; already-committed rows survive Job kill.
  schedule: "*/5 * * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # Headroom for one budgeted batch + curl overhead (still under ~150s proxy).
      activeDeadlineSeconds: 180
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tw-research-first-pass-drain
              image: curlimages/curl:8.7.1
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              env:
                - name: TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: stock-ticker-backend-auth
                      key: TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN
                      optional: true
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN:-}" ]; then
                    echo "TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN unset; drain tick skipped"
                    exit 0
                  fi
                  # budget 60s < curl 150s < lease 300s (renew per symbol)
                  curl --fail --show-error --silent --max-time 150 \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "X-Tw-Research-First-Pass-Drain-Token: ${TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN}" \
                    -d '{"dryRun":false,"maxBatches":1,"batchSize":5,"timeBudgetSeconds":60}' \
                    http://stock-ticker-backend:8000/api/tw-research/first-pass/drain
