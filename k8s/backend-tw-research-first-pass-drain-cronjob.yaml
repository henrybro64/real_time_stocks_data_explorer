apiVersion: batch/v1
kind: CronJob
metadata:
  name: stock-ticker-tw-research-first-pass-drain
spec:
  # Suspended until Henry explicitly enables durable first-pass drain (#349).
  # Prerequisites: #348 TypeError fix, configured drain token + owner user id,
  # TW_RESEARCH_FIRST_PASS_DRAIN_ENABLED=true on the API, and a Start Research
  # action that sets research_run.schedule_enabled=true for the owned job.
  # Does NOT unsuspend the technical-scan schedule CronJob (#330).
  suspend: true
  # Every 5 minutes every day (Asia/Taipei). Still suspend:true until enabled.
  # Timing hierarchy: budget 90s < curl --max-time 150s < lease 300s.
  # activeDeadlineSeconds 180 bounds the Job above curl but still under lease.
  schedule: "*/5 * * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # Headroom for one budgeted batch + curl overhead (still under ~150s proxy).
      activeDeadlineSeconds: 180
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tw-research-first-pass-drain
              image: curlimages/curl:8.7.1
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              env:
                - name: TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: stock-ticker-backend-auth
                      key: TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN
                      optional: true
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN:-}" ]; then
                    echo "TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN unset; drain tick skipped"
                    exit 0
                  fi
                  # budget 90s < curl 150s < lease 300s
                  curl --fail --show-error --silent --max-time 150 \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "X-Tw-Research-First-Pass-Drain-Token: ${TW_RESEARCH_FIRST_PASS_DRAIN_TOKEN}" \
                    -d '{"dryRun":false,"maxBatches":1,"batchSize":5,"timeBudgetSeconds":90}' \
                    http://stock-ticker-backend:8000/api/tw-research/first-pass/drain
