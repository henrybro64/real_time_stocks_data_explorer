# Backend connects to in-cluster Postgres (service stock-ticker-postgres).
# Credentials match k8s/postgres.yaml Secret stock-ticker-postgres.
# To use Postgres on the host instead, change DATABASE_URL (e.g. host.lima.internal) and
# remove postgres from k8s/kustomization.yaml if you do not want a cluster Postgres pod.
apiVersion: v1
kind: Secret
metadata:
  name: stock-ticker-backend-database
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://postgres:postgres@stock-ticker-postgres:5432/stocks?sslmode=disable&connect_timeout=15
