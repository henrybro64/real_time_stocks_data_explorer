apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-ticker-backend-env
data:
  API_PREFIX: /api
  REDIS_URL: redis://stock-ticker-redis:6379/0
  # Comma-separated; same-origin UI usually needs no CORS. Add LAN origins if you call the API from another host.
  CORS_ORIGINS: ""
  # Local auth: when enabled, users must sign in with LOCAL_AUTH_USERNAME / LOCAL_AUTH_PASSWORD.
  AUTH_ENABLED: "true"
  LOCAL_AUTH_ENABLED: "true"
  # When true, TW quote-based rankings (volume / change_up / change_down) rank the
  # full TWSE universe from the periodic snapshot refreshed by the CronJob below.
  # When false, rankings fall back to the small curated 7-stock universe.
  RANKINGS_TW_SNAPSHOT_ENABLED: "true"
  # Snapshot is considered usable for up to this many minutes after refresh.
  RANKINGS_TW_SNAPSHOT_MAX_AGE_MINUTES: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ticker-backend
  template:
    metadata:
      labels:
        app: stock-ticker-backend
    spec:
      initContainers:
        - name: migrate-db
          image: stock-ticker-backend:local
          imagePullPolicy: Never
          workingDir: /app/backend
          command:
            - sh
            - -c
            - alembic upgrade head
          envFrom:
            - configMapRef:
                name: stock-ticker-backend-env
            - secretRef:
                name: stock-ticker-backend-database
            - secretRef:
                name: stock-ticker-backend-auth
      containers:
        - name: backend
          image: stock-ticker-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: stock-ticker-backend-env
            - secretRef:
                name: stock-ticker-backend-database
            - secretRef:
                name: stock-ticker-backend-auth
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-backend
spec:
  selector:
    app: stock-ticker-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
