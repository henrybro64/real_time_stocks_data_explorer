apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-ticker-backend-env
data:
  API_PREFIX: /api
  DATABASE_URL: postgresql+psycopg://postgres:postgres@stock-ticker-postgres:5432/stocks
  REDIS_URL: redis://stock-ticker-redis:6379/0
  CORS_ORIGINS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ticker-backend
  template:
    metadata:
      labels:
        app: stock-ticker-backend
    spec:
      initContainers:
        - name: migrate-db
          image: stock-ticker-backend:local
          imagePullPolicy: Never
          workingDir: /app/backend
          command:
            - sh
            - -c
            - alembic upgrade head
          envFrom:
            - configMapRef:
                name: stock-ticker-backend-env
      containers:
        - name: backend
          image: stock-ticker-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: stock-ticker-backend-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-backend
spec:
  selector:
    app: stock-ticker-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
