apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-ticker-backend-env
data:
  API_PREFIX: /api
  REDIS_URL: redis://stock-ticker-redis:6379/0
  # Comma-separated; same-origin UI usually needs no CORS. Add LAN origins if you call the API from another host.
  CORS_ORIGINS: ""
  # Local auth: when enabled, users must sign in with LOCAL_AUTH_USERNAME / LOCAL_AUTH_PASSWORD.
  AUTH_ENABLED: "true"
  LOCAL_AUTH_ENABLED: "true"
  # API pods serve requests only; stock-ticker-backend-worker runs jobs (#276).
  RUN_BACKGROUND_JOBS: "false"
  # Traefik appends the client. Next forwards that header. One trusted hop (#273).
  TRUSTED_PROXY_HOPS: "1"
  # Background quote refresher (#130)
  QUOTE_REFRESHER_ENABLED: "true"
  QUOTE_REFRESHER_OWNS_UPSTREAM: "true"
  QUOTE_REFRESHER_OPEN_POLL_SECONDS: "45"
  QUOTE_REFRESHER_CLOSED_POLL_SECONDS: "900"
  QUOTE_REFRESHER_MAX_CONCURRENCY: "3"
  QUOTE_REFRESHER_MIN_INTERVAL_SECONDS: "0.35"
  QUOTE_REFRESHER_CYCLE_TIMEOUT_SECONDS: "40"
  QUOTE_REFRESHER_JITTER_SECONDS: "2"
  QUOTE_CACHE_HARD_TTL_SECONDS: "3600"
  # Redis quote-cache reconnect backoff (#132)
  QUOTE_REDIS_RETRY_BASE_SECONDS: "5"
  QUOTE_REDIS_RETRY_MAX_SECONDS: "60"
  QUOTE_REDIS_RETRY_JITTER_SECONDS: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ticker-backend
  template:
    metadata:
      labels:
        app: stock-ticker-backend
    spec:
      initContainers:
        - name: migrate-db
          image: stock-ticker-backend:local
          imagePullPolicy: Never
          workingDir: /app/backend
          command:
            - sh
            - -c
            - alembic upgrade head
          envFrom:
            - configMapRef:
                name: stock-ticker-backend-env
            - secretRef:
                name: stock-ticker-backend-database
            - secretRef:
                name: stock-ticker-backend-auth
            - secretRef:
                name: stock-ticker-backend-rankings-archive
                optional: true
      containers:
        - name: backend
          image: stock-ticker-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: stock-ticker-backend-env
            - secretRef:
                name: stock-ticker-backend-database
            - secretRef:
                name: stock-ticker-backend-auth
            - secretRef:
                name: stock-ticker-backend-rankings-archive
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-backend
spec:
  selector:
    app: stock-ticker-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
