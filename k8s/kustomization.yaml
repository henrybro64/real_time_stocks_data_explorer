apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stock-ticker
resources:
  - namespace.yaml
  - redis.yaml
  - postgres.yaml
  - backend-database-secret.yaml
  - backend-auth-secret.yaml
  - backend.yaml
  - backend-history-capture-cronjob.yaml
  - aws-health-heartbeat.yaml
  - frontend.yaml
  - frontend-nodeport.yaml

configMapGenerator:
  # Distinct from Secret stock-ticker-aws-health-heartbeat (credentials).
  - name: stock-ticker-aws-health-heartbeat-script
    files:
      - send_heartbeat.py=aws-health-heartbeat/send_heartbeat.py
    options:
      disableNameSuffixHash: true
