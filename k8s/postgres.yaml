apiVersion: v1
kind: Secret
metadata:
  name: stock-ticker-postgres
type: Opaque
stringData:
  POSTGRES_DB: stocks
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stock-ticker-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ticker-postgres
  template:
    metadata:
      labels:
        app: stock-ticker-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: stock-ticker-postgres
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stock-ticker-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-postgres
spec:
  selector:
    app: stock-ticker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
