# postgres:16-alpine with a PersistentVolumeClaim so data survives pod restarts and host reboots.
# k3s / k3d: use the default Rancher local-path StorageClass so the PVC binds (kubectl get storageclass).
# If your cluster uses another default SC, change or remove storageClassName below.
---
apiVersion: v1
kind: Secret
metadata:
  name: stock-ticker-postgres
type: Opaque
stringData:
  POSTGRES_DB: stocks
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stock-ticker-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-postgres
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  # RWO PVC: RollingUpdate can run old+new pods briefly; the second pod cannot mount the same volume,
  # leaving "old replicas pending termination" and a stuck rollout. Recreate tears down first, then starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stock-ticker-postgres
  template:
    metadata:
      labels:
        app: stock-ticker-postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: stock-ticker-postgres
          # ext4 volumes (typical local-path) have lost+found at the mount root; Postgres refuses
          # to init in a non-empty directory. Use a subdirectory for PGDATA (official image pattern).
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          # Without this, liveness can restart the container while initdb/recovery is still running.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stock-ticker-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-postgres
spec:
  selector:
    app: stock-ticker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
