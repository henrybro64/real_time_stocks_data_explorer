# postgres:16-alpine with a PersistentVolumeClaim so data survives pod restarts and host reboots.
# k3s / k3d: use the default Rancher local-path StorageClass so the PVC binds (kubectl get storageclass).
# If your cluster uses another default SC, change or remove storageClassName below.
# If PVC stays Pending and the pod shows VolumeBinding "context deadline exceeded", fix local-path-provisioner
# / disk space (see README k3s troubleshooting) — Postgres will not start until the PVC is Bound.
---
apiVersion: v1
kind: Secret
metadata:
  name: stock-ticker-postgres
type: Opaque
stringData:
  POSTGRES_DB: stocks
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stock-ticker-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker-postgres
spec:
  replicas: 1
  # Must exceed worst-case first boot (initdb on slow disks). tcp probes below avoid exec/env flake.
  progressDeadlineSeconds: 2400
  # RWO PVC: RollingUpdate can run old+new pods briefly; the second pod cannot mount the same volume,
  # leaving "old replicas pending termination" and a stuck rollout. Recreate tears down first, then starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stock-ticker-postgres
  template:
    metadata:
      labels:
        app: stock-ticker-postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # appArmorProfile is temporary and on this container only (#308). On
          # Ubuntu 26.04 the containerd default profile denies signals between
          # processes in the same container (containerd#14485), so gosu and
          # Postgres hang. Removal criteria: docs/postgres-apparmor.md. Do not
          # replace it with an explicit RuntimeDefault; delete it instead.
          # allowPrivilegeEscalation: gosu only drops root to postgres, which
          # no_new_privs still allows.
          securityContext:
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: stock-ticker-postgres
          # ext4 volumes (typical local-path) have lost+found at the mount root; Postgres refuses
          # to init in a non-empty directory. Use a subdirectory for PGDATA (official image pattern).
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          # Startup and liveness stay on TCP: a liveness restart in the middle of a
          # long crash recovery would make it worse.
          startupProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
            failureThreshold: 360
            timeoutSeconds: 3
          # Readiness asks Postgres itself (#308). TCP accepts while Postgres is
          # still starting or stuck in recovery, e.g. when checkpoint signals are
          # denied. Fixed arguments, no shell: no env expansion. Local socket as
          # postgres (trust inside the pod), so no password and no role-missing
          # log lines. Explicit timeout instead of the 1s default.
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stock-ticker-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ticker-postgres
spec:
  selector:
    app: stock-ticker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
